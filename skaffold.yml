apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}
  
  artifacts:
    - image: frontend
      context: frontend
      docker:
        dockerfile: Dockerfile.dev
      sync:
        infer:
          - "src/**"
          - "public/**"
          - "*.html"
          - "vite.config.js"
    - image: ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"


    - image: auth
      context: auth
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: notification
      context: notification
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"
    

    - image: agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile

    
    - image: sync-agent
      context: sandbox/sync-agent
      docker:
        dockerfile: dockerfile

    - image: router
      context: sandbox/router
      docker:
        dockerfile: dockerfile

    - image: sandbox
      context: sandbox/server
      docker:
        dockerfile: dockerfile

    - image: template
      context: sandbox/template
      docker:
        dockerfile: dockerfile

manifests:
  rawYaml:
    - k8s/frontend-deployment.yml
    - k8s/frontend-service.yml
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/ingress.yml
    - k8s/rbac.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/database-secrets.yml
    - k8s/jwt-secrets.yml
    - k8s/google-secrets.yml
    - k8s/ai-secrets.yml
    - k8s/aws-secrets.yml
    - k8s/notification-deployment.yml
    - k8s/notification-service.yml

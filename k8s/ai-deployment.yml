apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - image:  ai-orchestration
        name:  ai-server
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        env: 
          - name: GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: GROQ_API_KEY

          - name: MISTRAL_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: MISTRAL_API_KEY
                optional: true
                
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: GEMINI_API_KEY
                optional: true

          
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        ports:
        - containerPort:  3000
          name:  ai-server-port
        
      
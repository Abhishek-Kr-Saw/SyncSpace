# Example Secrets Template for SyncSpace
# Copy this file to k8s/secrets.local.yml and fill in your real credentials:
#   cp k8s/secrets.example.yml k8s/secrets.local.yml
#   kubectl apply -f k8s/secrets.local.yml

apiVersion: v1
kind: Secret
metadata:
  name: database
type: Opaque
stringData:
  AUTH: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/auth"
  SANDBOX: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/sandbox"
  REDIS_URL: "redis://default:<password>@<redis-host>:<port>"
  RABBITMQ_URL: "amqps://<user>:<password>@<rabbitmq-host>/<vhost>"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt
type: Opaque
stringData:
  JWT_SECRET: "your-super-secret-jwt-key-min-32-chars"

---
apiVersion: v1
kind: Secret
metadata:
  name: google
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GOOGLE_CALLBACK_URL: "http://localhost/api/auth/google/callback"
  GOOGLE_REFRESH_TOKEN: "your-gmail-oauth-refresh-token"
  EMAIL_USER: "your-email@gmail.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: ai
type: Opaque
stringData:
  GROQ_API_KEY: "gsk_your_groq_api_key"
  GEMINI_API_KEY: "AIzaSy_your_gemini_api_key"
  MISTRAL_API_KEY: "your_mistral_api_key"

---
apiVersion: v1
kind: Secret
metadata:
  name: aws
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "your-aws-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-access-key"
  AWS_REGION: "ap-south-1"
